# docker-compose.yml — Always-on CPU Stack (e2-medium)
# Services: Redis, OmniRoute (Primary Router), FreeLLMAPI (Fallback Aggregator), Orchestrator

version: "3.9"

services:
  # ── Redis: Job queue, caching, rate limiting ──────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── FreeLLMAPI: Secondary Free LLM Aggregator ────────────────────
  # Upstream fallback aggregator wired into OmniRoute
  # Repo: https://github.com/tashfeenahmed/freellmapi
  freellm:
    image: python:3.12-slim
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./services:/app/services:ro
      - ./.env:/app/.env:ro
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379/1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn &&
               python /app/services/freellm_server.py"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── OmniRoute: Primary LLM Gateway with Free-Tier Fallback ──────
  # Intelligent router with token compression & fallback chains
  # Repo: https://github.com/cheaper-inference/OmniRoute
  omniroute:
    image: python:3.12-slim
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./services:/app/services:ro
      - ./configs/omniroute_config.json:/app/config.json:ro
      - ./skills:/app/skills:ro
      - ./.env:/app/.env:ro
    environment:
      - PORT=8080
      - OMNIROUTE_CONFIG=/app/config.json
      - FREELLM_UPSTREAM_URL=http://freellm:8081
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      freellm:
        condition: service_healthy
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn &&
               python /app/services/omniroute_server.py"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Orchestrator: Multi-Agent Pipeline Runner & 24/7 Daemon ─────
  orchestrator:
    image: python:3.12-slim
    restart: unless-stopped
    volumes:
      - ./agents:/app/agents:ro
      - ./infra:/app/infra:ro
      - ./configs:/app/configs:ro
      - ./skills:/app/skills:ro
      - ./assets:/app/assets:ro
      - ./data:/app/data
      - ./renders:/app/renders
      - ./memory:/app/memory
      - ./.env:/app/.env:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OMNIROUTE_BASE_URL=http://omniroute:8080/v1
      - FREELLM_URL=http://freellm:8081
      - GPU_CONTROLLER_ENABLED=${GPU_CONTROLLER_ENABLED:-false}
      - YOUTUBE_CHANNEL_ID_EN=${YOUTUBE_CHANNEL_ID_EN:-}
      - AUTO_PUBLISH=${AUTO_PUBLISH:-false}
    depends_on:
      redis:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    command: >
      bash -c "apt-get update && apt-get install -y ffmpeg &&
               pip install --no-cache-dir redis httpx pyyaml schedule pillow edge-tts &&
               python -m agents.orchestrator --daemon"

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: almighty_cpu_net
