# docker-compose.yml — Always-on CPU Stack (e2-medium)
# Services: Redis, OmniRoute (LLM gateway), FreeLLMAPI (fallback aggregator), Orchestrator
#
# All three Python services run from one image built from ./Dockerfile with
# pinned dependencies (requirements.txt). Rebuild after changing requirements:
#   docker compose up -d --build

x-studio-image: &studio-image
  image: almighty-studio:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  # ── Redis: Job queue, caching, rate limiting ──────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── FreeLLMAPI: text-only free-tier aggregator (in-repo service) ──
  freellm:
    <<: *studio-image
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./services:/app/services:ro
      - ./.env:/app/.env:ro
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379/1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    command: python /app/services/freellm_server.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── OmniRoute: LLM gateway, text + vision via Gemini (in-repo service) ──
  omniroute:
    <<: *studio-image
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./services:/app/services:ro
      - ./configs/omniroute_config.json:/app/config.json:ro
      - ./.env:/app/.env:ro
    environment:
      - PORT=8080
      - OMNIROUTE_CONFIG=/app/config.json
      - FREELLM_UPSTREAM_URL=http://freellm:8081
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      freellm:
        condition: service_healthy
    command: python /app/services/omniroute_server.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Orchestrator: pipeline runner & IST scheduler ────────────────
  orchestrator:
    <<: *studio-image
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./agents:/app/agents:ro
      - ./infra:/app/infra:ro
      - ./configs:/app/configs          # Writable only for the YouTube OAuth token refresh
      - ./skills:/app/skills:ro
      - ./assets:/app/assets:ro
      - ./data:/app/data
      - ./renders:/app/renders
      - ./memory:/app/memory            # SQLite, publish queue, learned playbook state
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://redis:6379/0
      - OMNIROUTE_BASE_URL=http://omniroute:8080/v1
      - FREELLM_URL=http://freellm:8081
      - GPU_CONTROLLER_ENABLED=${GPU_CONTROLLER_ENABLED:-false}
      - YOUTUBE_PRIVACY_STATUS=${YOUTUBE_PRIVACY_STATUS:-public}
      - AUTO_PUBLISH=${AUTO_PUBLISH:-true}
    depends_on:
      redis:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    command: python -m agents.orchestrator --daemon

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: almighty_cpu_net
