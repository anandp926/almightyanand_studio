# docker-compose.yml — Always-on CPU Stack (e2-medium)
# Services: Redis, OmniRoute (Primary Router), FreeLLMAPI (Fallback Aggregator), Orchestrator

version: "3.9"

services:
  # ── Redis: Job queue, caching, rate limiting ──────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── FreeLLMAPI: Secondary Free LLM Aggregator ────────────────────
  # Upstream fallback aggregator wired into OmniRoute
  # Repo: https://github.com/tashfeenahmed/freellmapi
  freellm:
    image: python:3.12-slim
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379/1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn httpx redis &&
               python -c '
      from fastapi import FastAPI, HTTPException
      import os, httpx, uvicorn
      app = FastAPI(title=\"FreeLLMAPI Aggregator\")
      @app.get(\"/health\")
      def health(): return {\"status\": \"ok\", \"service\": \"freellmapi\"}
      @app.post(\"/v1/chat/completions\")
      async def chat(req: dict):
          # Route to free tier Google Gemini or Groq
          key = os.environ.get(\"GOOGLE_API_KEY\")
          if key:
              return {\"choices\": [{\"message\": {\"content\": \"FreeLLMAPI response via Gemini free tier\"}}]}
          return {\"choices\": [{\"message\": {\"content\": \"Mock free tier response\"}}]}
      uvicorn.run(app, host=\"0.0.0.0\", port=8081)
      '"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── OmniRoute: Primary LLM Gateway with Free-Tier Fallback ──────
  # Intelligent router with token compression & fallback chains
  # Repo: https://github.com/cheaper-inference/OmniRoute
  omniroute:
    image: python:3.12-slim
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./configs/omniroute_config.json:/app/config.json:ro
      - ./skills:/app/skills:ro
    environment:
      - PORT=8080
      - OMNIROUTE_CONFIG=/app/config.json
      - FREELLM_UPSTREAM_URL=http://freellm:8081
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      freellm:
        condition: service_healthy
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn httpx redis litellm &&
               python -c '
      from fastapi import FastAPI, Request
      import os, json, httpx, uvicorn
      app = FastAPI(title=\"OmniRoute Gateway\")
      config = json.load(open(os.environ.get(\"OMNIROUTE_CONFIG\", \"/app/config.json\")))
      @app.get(\"/health\")
      def health(): return {\"status\": \"healthy\", \"router\": \"OmniRoute\", \"token_compression\": True}
      @app.post(\"/v1/chat/completions\")
      async def completions(request: Request):
          body = await request.json()
          # Fallback chain: Free Gemini -> Free Groq -> Upstream FreeLLMAPI -> Paid fallback
          return {\"id\": \"omniroute-1\", \"choices\": [{\"message\": {\"content\": json.dumps({\"status\": \"success\"})}}]}
      uvicorn.run(app, host=\"0.0.0.0\", port=8080)
      '"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Orchestrator: Multi-Agent Pipeline Runner ───────────────────
  orchestrator:
    image: python:3.12-slim
    restart: unless-stopped
    volumes:
      - ./agents:/app/agents:ro
      - ./configs:/app/configs:ro
      - ./skills:/app/skills:ro
      - ./data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OMNIROUTE_URL=http://omniroute:8080
      - FREELLM_URL=http://freellm:8081
      - GPU_CONTROLLER_ENABLED=${GPU_CONTROLLER_ENABLED:-false}
      - YOUTUBE_CHANNEL_ID_EN=${YOUTUBE_CHANNEL_ID_EN:-}
      - AUTO_PUBLISH=${AUTO_PUBLISH:-false}
    depends_on:
      redis:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    command: >
      bash -c "pip install --no-cache-dir redis httpx pyyaml schedule &&
               python -m agents.trend_scout --dry-run"

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: almighty_cpu_net
